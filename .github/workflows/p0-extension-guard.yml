name: p0-extension-guard
on:
  pull_request:
    paths:
      - 'extension/**'
      - 'src/**'
      - 'frontend/**'
      - 'public/**'
      - 'admin-dashboard/**'
      - 'manifest.json'
      - 'vite.config.js'
      - 'package.json'
      - 'scripts/sync-extension.js'
  push:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check extension is production standalone
        run: node scripts/check-extension-build.js
      - name: Verify source and extension integrity
        run: |
          # Kiểm tra nếu có thay đổi ngoài assets/ (vd: options.html không được build, code source bị lệch)
          DIRTY_NON_ASSETS=$(git status --porcelain extension/ | grep -v 'extension/assets/' || true)
          if [ -n "$DIRTY_NON_ASSETS" ]; then
            echo "::warning::Phát hiện các file extension ngoài assets/ có thay đổi:"
            echo "$DIRTY_NON_ASSETS"
          fi
          echo "✅ Extension standalone production build check passed."
