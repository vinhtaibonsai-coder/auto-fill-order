name: p0-extension-guard
on:
  pull_request:
    paths:
      - 'extension/**'
      - 'src/**'
      - 'frontend/**'
      - 'public/**'
      - 'admin-dashboard/**'
      - 'manifest.json'
      - 'vite.config.js'
      - 'package.json'
      - 'scripts/sync-extension.js'
  push:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check extension is production standalone
        run: node scripts/check-extension-build.js
      - name: Fail if extension/ not synced
        run: |
          if [ -n "$(git status --porcelain extension/)" ]; then
            echo "::error::extension/ chưa sync - chạy npm run build và commit"
            git diff extension/ | head -n 200
            exit 1
          fi
