<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    :root {
      --bg: #0a0e1a;
      --surface: #111827;
      --surface2: #1a2236;
      --border: #1e2d4a;
      --text: #e2e8f0;
      --text-muted: #8892a4;
      --accent: #38bdf8;
      --accent2: #818cf8;
      --green: #34d399;
      --yellow: #fbbf24;
      --red: #f87171;
      --orange: #fb923c;
      --font: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', 'Consolas', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      padding: 0;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      border-bottom: 1px solid var(--border);
      padding: 32px 40px;
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -20%;
      width: 60%;
      height: 200%;
      background: radial-gradient(ellipse, rgba(56,189,248,.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
      position: relative;
    }
    .header p {
      color: var(--text-muted);
      font-size: 14px;
      position: relative;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 24px 40px 60px; }

    /* ── Controls ── */
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
      align-items: center;
    }
    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-family: var(--font);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all .2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      color: #0f172a;
      box-shadow: 0 0 20px rgba(56,189,248,.2);
    }
    .btn-primary:hover { box-shadow: 0 0 30px rgba(56,189,248,.35); }
    .btn-primary:disabled {
      opacity: .5;
      cursor: not-allowed;
      box-shadow: none;
    }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #243049; }

    .iter-input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      width: 80px;
      text-align: center;
    }
    .iter-input:focus { outline: none; border-color: var(--accent); }
    .iter-label { color: var(--text-muted); font-size: 13px; }

    /* ── Status ── */
    .status-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 20px;
      margin-bottom: 24px;
      font-size: 13px;
      font-family: var(--mono);
      color: var(--text-muted);
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-bar .spinner {
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Summary Cards ── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      position: relative;
      overflow: hidden;
    }
    .summary-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      border-radius: 12px 12px 0 0;
    }
    .summary-card.fast::before { background: linear-gradient(90deg, var(--green), #22d3ee); }
    .summary-card.medium::before { background: linear-gradient(90deg, var(--yellow), var(--orange)); }
    .summary-card.slow::before { background: linear-gradient(90deg, var(--orange), var(--red)); }
    .summary-card .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .summary-card .value {
      font-size: 28px;
      font-weight: 800;
      font-family: var(--mono);
    }
    .summary-card .unit {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 2px;
    }

    /* ── Result Table ── */
    .results-section { margin-bottom: 32px; }
    .results-section h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .results-section h2 .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .results-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .results-table th {
      background: var(--surface2);
      padding: 12px 16px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-muted);
      text-align: left;
      border-bottom: 1px solid var(--border);

    .results-table td {

    .results-table .mono { font-family: var(--mono); font-size: 13px; }
    .results-table .test-name { font-weight: 600; color: var(--text); }
    .results-table .badge {

      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      font-family: var(--mono);
    }

    .badge-medium { background: rgba(251,191,36,.12); color: var(--yellow); }
    .badge-slow { background: rgba(248,113,113,.12); color: var(--red); }

    /* ── Latency Bar ── */

      display: flex;
      align-items: center;
      gap: 8px;
    }
    .latency-bar {
      height: 6px;
      border-radius: 3px;
      min-width: 4px;

    .latency-bar.fast { background: linear-gradient(90deg, var(--green), #22d3ee); }

      padding: 20px;

      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;

    /* ── Loading overlay ── */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity .4s;
    }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; }
    #loading-overlay .big-spinner {
      width: 48px; height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    #loading-overlay p { color: var(--text-muted); font-size: 14px; }

    /* ── Memory info ── */
    .memory-info {

      gap: 24px;
      flex-wrap: wrap;
      margin-top: 16px;
    }
    .mem-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .mem-item .mem-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text-muted);
    }
    .mem-item .mem-value {
      font-family: var(--mono);
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
    }
  </style>
</head>

  // ─── UTILITY FUNCTIONS ───────────────────────────────────────────────
  function percentile(arr, p) {
    const sorted = [...arr].sort((a, b) => a - b);
    const idx = Math.ceil(p / 100 * sorted.length) - 1;
    return sorted[Math.max(0, idx)];
  }

  function avg(arr) {
    return arr.reduce((s, v) => s + v, 0) / arr.length;
  }

  function formatMs(ms) {
    if (ms < 0.01) return '<0.01';
    if (ms < 1) return ms.toFixed(3);
    if (ms < 10) return ms.toFixed(2);
    if (ms < 100) return ms.toFixed(1);
    return ms.toFixed(0);
  }

  function getSpeedClass(ms) {
    if (ms < 1) return 'fast';
    if (ms < 10) return 'medium';
    return 'slow';
  }

  function getSpeedBadge(ms) {
    const cls = getSpeedClass(ms);
    const labels = { fast: '⚡ Fast', medium: '⏱ Medium', slow: '🐢 Slow' };
    return `<span class="badge badge-${cls}">${labels[cls]}</span>`;
  }

  // ─── BENCHMARK RUNNER ────────────────────────────────────────────────
  function benchmark(name, fn, iterations) {
    const times = [];
    // Warm up (5 runs)
    for (let i = 0; i < 5; i++) fn();

    for (let i = 0; i < iterations; i++) {
      const start = performance.now();
      fn();
      const end = performance.now();
      times.push(end - start);
    }

    return {
      name,
      iterations,
      times,
      avg: avg(times),
      min: Math.min(...times),
      max: Math.max(...times),
      p50: percentile(times, 50),
      p95: percentile(times, 95),
      p99: percentile(times, 99),
      total: times.reduce((s, v) => s + v, 0),
      opsPerSec: Math.round(1000 / avg(times)),
    };
  }

  async function benchmarkAsync(name, fn, iterations) {
    const times = [];
    // Warm up
    for (let i = 0; i < 3; i++) await fn();

    for (let i = 0; i < iterations; i++) {
      const start = performance.now();
      await fn();
      const end = performance.now();
      times.push(end - start);
    }

    return {
      name,
      iterations,
      times,
      avg: avg(times),
      min: Math.min(...times),
      max: Math.max(...times),
      p50: percentile(times, 50),
      p95: percentile(times, 95),
      p99: percentile(times, 99),
      total: times.reduce((s, v) => s + v, 0),
      opsPerSec: Math.round(1000 / avg(times)),
    };
  }

  // ─── TEST SUITES ─────────────────────────────────────────────────────
  function defineTests(iters) {
    const suites = [];

    // ══════════════════════════════════════════════════════════════════
    // 1. ORDER PARSER
    // ══════════════════════════════════════════════════════════════════
    const orderParserTests = [];

    // Per-order tests
    TEST_ORDERS.forEach((order, idx) => {
      const shortName = order.split('\n')[0].substring(0, 30);
      orderParserTests.push(benchmark(
        `Đơn #${idx + 1}: ${shortName}...`,
        () => OrderProcessor.parse(order),
        iters
      ));
    });

    // Batch: all 20 orders
    orderParserTests.push(benchmark(
      '📦 Batch: 20 đơn cùng lúc',
      () => { TEST_ORDERS.forEach(o => OrderProcessor.parse(o)); },
      Math.max(10, Math.floor(iters / 5))
    ));

    suites.push({ name: '📝 Order Parser (runLocalComputerParser)', icon: '📝', results: orderParserTests });

    // ══════════════════════════════════════════════════════════════════
    // 2. ADDRESS NORMALIZER
    // ══════════════════════════════════════════════════════════════════
    const normalizerTests = [];
    TEST_ADDRESSES.forEach((addr, idx) => {
      normalizerTests.push(benchmark(
        `Addr #${idx + 1}: ${addr.substring(0, 40)}...`,
        () => AddressNormalizer.normalize(addr),
        iters
      ));
    });
    normalizerTests.push(benchmark(
      '📦 Batch: 20 địa chỉ normalize',
      () => { TEST_ADDRESSES.forEach(a => AddressNormalizer.normalize(a)); },
      Math.max(10, Math.floor(iters / 5))
    ));

    suites.push({ name: '🔤 Address Normalizer', icon: '🔤', results: normalizerTests });

    // ══════════════════════════════════════════════════════════════════
    // 3. FUZZY MATCHING
    // ══════════════════════════════════════════════════════════════════
    const fuzzyTests = [];
    TEST_FUZZY_PAIRS.forEach((pair, idx) => {
      fuzzyTests.push(benchmark(
        `Fuzzy: "${pair.query}" → [${pair.candidates.length} ứng viên]`,
        () => AddressFuzzy.findBestMatch(pair.query, pair.candidates),
        iters
      ));
    });

    // Fuzzy with large candidate list (tất cả tỉnh)
    if (typeof ADM_DB !== 'undefined') {
      const allProvNames = ADM_DB.provinces.map(p => p.name);
      fuzzyTests.push(benchmark(
        `Fuzzy: "${TEST_FUZZY_PAIRS[0].query}" → [${allProvNames.length} tỉnh]`,
        () => AddressFuzzy.findBestMatch(TEST_FUZZY_PAIRS[0].query, allProvNames),
        iters
      ));
    }

    // Levenshtein raw
    fuzzyTests.push(benchmark(
      'Levenshtein: "Nguyễn Cư Trinh" vs "Nguyễn Cư Trinh"',
      () => AddressFuzzy.levenshtein('Nguyễn Cư Trinh', 'Nguyễn Cư Trinh'),
      iters
    ));
    fuzzyTests.push(benchmark(
      'Levenshtein: "Bến Thanh" vs "Bến Thành"',
      () => AddressFuzzy.levenshtein('Bến Thanh', 'Bến Thành'),
      iters
    ));

    suites.push({ name: '🔍 Fuzzy Matching (Levenshtein)', icon: '🔍', results: fuzzyTests });

    // ══════════════════════════════════════════════════════════════════
    // 4. ADDRESS PARSER
    // ══════════════════════════════════════════════════════════════════
    const addrParserTests = [];
    TEST_ADDRESSES.forEach((addr, idx) => {
      const normalized = AddressNormalizer.normalize(addr);
      addrParserTests.push(benchmark(
        `Parse #${idx + 1}: ${addr.substring(0, 40)}...`,
        () => AddressParser.parse(normalized),
        iters
      ));
    });
    addrParserTests.push(benchmark(
      '📦 Batch: 20 địa chỉ parse',
      () => {
        TEST_ADDRESSES.forEach(a => {
          const n = AddressNormalizer.normalize(a);
          AddressParser.parse(n);
        });
      },
      Math.max(10, Math.floor(iters / 5))
    ));

    suites.push({ name: '📍 Address Parser', icon: '📍', results: addrParserTests });

    // ══════════════════════════════════════════════════════════════════
    // 5. ADDRESS VALIDATOR
    // ══════════════════════════════════════════════════════════════════
    const validatorTests = [];
    const sampleParsed = [
      { province: "Thành phố Hồ Chí Minh", district: "Quận 1", ward: "Phường Bến Thành", street: "123 Lê Lợi" },
      { province: "Thành phố Hà Nội", district: "Quận Ba Đình", ward: "Phường Trúc Bạch", street: "15 Nguyễn Trường Tộ" },
      { province: "Thành phố Đà Nẵng", district: "Quận Hải Châu", ward: "Phường Hải Châu 1", street: "78 Trần Phú" },
      { province: "Tỉnh Đắk Lắk", district: "Huyện Krông Pắk", ward: "Xã Ea Kly", street: "Thôn 3" },
      { province: "Invalid Province", district: "Invalid District", ward: "Invalid Ward", street: "test" },
    ];
    sampleParsed.forEach((parsed, idx) => {
      validatorTests.push(benchmark(
        `Validate: ${parsed.province.substring(0, 25)}...`,
        () => AddressValidator.validate(parsed),
        iters
      ));
    });

    suites.push({ name: '✅ Address Validator', icon: '✅', results: validatorTests });

    // ══════════════════════════════════════════════════════════════════
    // 6. ADDRESS RULES
    // ══════════════════════════════════════════════════════════════════
    const rulesTests = [];
    const sampleForRules = [
      { province: "Thành phố Hồ Chí Minh", district: "Quận 9", ward: "Phường Long Thạnh Mỹ", street: "123 Đỗ Xuân Hợp" },
      { province: "Thành phố Hồ Chí Minh", district: "Quận 2", ward: "Phường Thảo Điền", street: "45 Nguyễn Văn Hưởng" },
      { province: "HCM", district: "Q.10", ward: "Phường 12", street: "15 Đường 3/2" },
      { province: "Tỉnh Lâm Đồng", district: "Thành phố Đà Lạt", ward: "", street: "Tô Vĩnh Diện" },
      { province: "Hậu Giang", district: "Huyện Châu Thành A", ward: "Xã Tân Hòa", street: "Ấp Phú Hòa" },
    ];
    sampleForRules.forEach((parsed, idx) => {
      rulesTests.push(benchmark(
        `Rules: ${parsed.province.substring(0, 20)} / ${parsed.district}`,
        () => AddressRules.applyRules({ ...parsed }),
        iters
      ));
    });

    suites.push({ name: '📐 Address Rules (sáp nhập 2025)', icon: '📐', results: rulesTests });

    return suites;
  }

  async function defineAsyncTests(iters) {
    const suites = [];

    // ══════════════════════════════════════════════════════════════════
    // 7. FULL ENGINE PIPELINE (async)
    // ══════════════════════════════════════════════════════════════════
    const engineTests = [];
    const selectedAddresses = TEST_ADDRESSES.slice(0, 10); // first 10 for speed

    for (let idx = 0; idx < selectedAddresses.length; idx++) {
      const addr = selectedAddresses[idx];
      const result = await benchmarkAsync(
        `Engine #${idx + 1}: ${addr.substring(0, 40)}...`,
        async () => await AddressEngine.process(addr),
        Math.max(10, Math.floor(iters / 10))
      );
      engineTests.push(result);
    }

    // Full pipeline: order parse → address engine
    const fullPipeTest = await benchmarkAsync(
      '🔥 Full Pipeline: parse đơn → engine',
      async () => {
        const order = TEST_ORDERS[Math.floor(Math.random() * TEST_ORDERS.length)];
        const parsed = OrderProcessor.parse(order);
        if (parsed.address && parsed.address !== "không tìm thấy") {
          await AddressEngine.process(parsed.address, parsed.phone);
        }
      },
      Math.max(10, Math.floor(iters / 10))
    );
    engineTests.push(fullPipeTest);

    suites.push({ name: '🚀 Full Address Engine Pipeline', icon: '🚀', results: engineTests });
    return suites;
  }

  // ─── RENDERING ───────────────────────────────────────────────────────
  function renderSummary(allResults) {
    const grid = document.getElementById('summaryGrid');
    grid.style.display = 'grid';

    const allAvgs = allResults.map(r => r.avg);
    const totalMs = allResults.reduce((s, r) => s + r.total, 0);
    const fastest = Math.min(...allAvgs);
    const slowest = Math.max(...allAvgs);
    const overallAvg = avg(allAvgs);
    const totalOps = allResults.reduce((s, r) => s + r.opsPerSec, 0);

    const cards = [
      { label: 'Trung bình chung', value: formatMs(overallAvg), unit: 'ms', cls: getSpeedClass(overallAvg) },
      { label: 'Nhanh nhất', value: formatMs(fastest), unit: 'ms', cls: 'fast' },
      { label: 'Chậm nhất', value: formatMs(slowest), unit: 'ms', cls: getSpeedClass(slowest) },
      { label: 'Tổng thời gian', value: totalMs < 1000 ? formatMs(totalMs) : (totalMs / 1000).toFixed(2), unit: totalMs < 1000 ? 'ms' : 's', cls: getSpeedClass(totalMs / allResults.length) },
      { label: 'Số test', value: allResults.length, unit: 'tests', cls: 'fast' },
    ];

    grid.innerHTML = cards.map(c => `
      <div class="summary-card ${c.cls}">
        <div class="label">${c.label}</div>
        <div class="value">${c.value}<span class="unit">${c.unit}</span></div>
      </div>
    `).join('');

    // Memory info
    if (performance.memory) {
      const m = performance.memory;
      const mb = (bytes) => (bytes / 1048576).toFixed(1);
      grid.innerHTML += `
        <div class="summary-card fast">
          <div class="label">Heap Used</div>
          <div class="value">${mb(m.usedJSHeapSize)}<span class="unit">MB</span></div>
        </div>
        <div class="summary-card fast">
          <div class="label">Heap Total</div>
          <div class="value">${mb(m.totalJSHeapSize)}<span class="unit">MB</span></div>
        </div>
      `;
    }
  }

  function renderSuite(suite) {
    const maxAvg = Math.max(...suite.results.map(r => r.avg), 0.1);

    let html = `
      <div class="results-section">
        <h2><span class="dot" style="background:var(--accent)"></span>${suite.name}</h2>
        <table class="results-table">
          <thead>
            <tr>
              <th style="width:35%">Test</th>
              <th>Avg</th>
              <th>P50</th>
              <th>P95</th>
              <th>P99</th>
              <th>Min</th>
              <th>Max</th>
              <th>Ops/s</th>
              <th style="width:12%">Hiệu suất</th>
            </tr>
          </thead>
          <tbody>
    `;

    suite.results.forEach(r => {
      const barWidth = Math.max(4, (r.avg / maxAvg) * 180);
      const cls = getSpeedClass(r.p95);
      html += `
        <tr>
          <td class="test-name">${r.name}</td>
          <td class="mono">${formatMs(r.avg)}ms</td>
          <td class="mono">${formatMs(r.p50)}ms</td>
          <td class="mono">${formatMs(r.p95)}ms</td>
          <td class="mono">${formatMs(r.p99)}ms</td>
          <td class="mono" style="color:var(--green)">${formatMs(r.min)}ms</td>
          <td class="mono" style="color:var(--red)">${formatMs(r.max)}ms</td>
          <td class="mono" style="color:var(--accent)">${r.opsPerSec.toLocaleString()}</td>
          <td>
            <div class="latency-bar-wrap">
              <div class="latency-bar ${cls}" style="width:${barWidth}px"></div>
              ${getSpeedBadge(r.p95)}
            </div>
          </td>
        </tr>
      `;
    });

    html += '</tbody></table></div>';
    return html;
  }

  // ─── MAIN ────────────────────────────────────────────────────────────
  let lastResults = null;

  async function runBenchmark(iterations) {
    const statusBar = document.getElementById('statusBar');
    const container = document.getElementById('resultsContainer');
    const detailPanel = document.getElementById('detailPanel');
    const detailJson = document.getElementById('detailJson');
    const btnRun = document.getElementById('btnRun');
    const btnRunQuick = document.getElementById('btnRunQuick');
    const btnExport = document.getElementById('btnExport');

    btnRun.disabled = true;
    btnRunQuick.disabled = true;
    container.innerHTML = '';
    detailPanel.style.display = 'none';

    const allSuites = [];
    const allResults = [];

    // ── Sync tests ──
    statusBar.innerHTML = '<div class="spinner"></div> Đang chạy sync benchmarks...';
    await new Promise(r => setTimeout(r, 50)); // let UI update

    const syncSuites = defineTests(iterations);
    for (const suite of syncSuites) {
      allSuites.push(suite);
      suite.results.forEach(r => allResults.push(r));
      container.innerHTML += renderSuite(suite);
      statusBar.innerHTML = `<div class="spinner"></div> Hoàn thành: ${suite.name}`;
      await new Promise(r => setTimeout(r, 20));
    }

    // ── Async tests ──
    statusBar.innerHTML = '<div class="spinner"></div> Đang chạy async engine benchmarks...';
    await new Promise(r => setTimeout(r, 50));

    const asyncSuites = await defineAsyncTests(iterations);
    for (const suite of asyncSuites) {
      allSuites.push(suite);
      suite.results.forEach(r => allResults.push(r));
      container.innerHTML += renderSuite(suite);
    }

    // ── Render summary ──
    renderSummary(allResults);

    // ── Detail JSON ──
    const exportData = {
      timestamp: new Date().toISOString(),
      iterations,
      userAgent: navigator.userAgent,
      memory: performance.memory ? {
        usedJSHeapSize: performance.memory.usedJSHeapSize,
        totalJSHeapSize: performance.memory.totalJSHeapSize,
        jsHeapSizeLimit: performance.memory.jsHeapSizeLimit,
      } : null,
      dbStats: {
        provinces: typeof ADM_DB !== 'undefined' ? ADM_DB.provinces.length : 0,
        wardMergerEntries: typeof WARD_MERGER_MAP !== 'undefined' ? Object.keys(WARD_MERGER_MAP).length : 0,
      },
      suites: allSuites.map(s => ({
        name: s.name,
        results: s.results.map(r => ({
          name: r.name,
          iterations: r.iterations,
          avg: +r.avg.toFixed(4),
          p50: +r.p50.toFixed(4),
          p95: +r.p95.toFixed(4),
          p99: +r.p99.toFixed(4),
          min: +r.min.toFixed(4),
          max: +r.max.toFixed(4),
          opsPerSec: r.opsPerSec,
        }))
      }))
    };

    lastResults = exportData;
    detailJson.textContent = JSON.stringify(exportData, null, 2);
    detailPanel.style.display = 'block';

    const totalTimeMs = allResults.reduce((s, r) => s + r.total, 0);
    statusBar.innerHTML = `✅ Hoàn thành! ${allResults.length} tests × ${iterations} lần = ${(totalTimeMs / 1000).toFixed(2)}s tổng. DB: ${exportData.dbStats.provinces} tỉnh, ${exportData.dbStats.wardMergerEntries.toLocaleString()} ward mergers.`;

    btnRun.disabled = false;
    btnRunQuick.disabled = false;
    btnExport.disabled = false;
  }

  // ─── INIT ────────────────────────────────────────────────────────────
  function init() {
    const overlay = document.getElementById('loading-overlay');
    const statusBar = document.getElementById('statusBar');
    const btnRun = document.getElementById('btnRun');
    const btnRunQuick = document.getElementById('btnRunQuick');
    const btnExport = document.getElementById('btnExport');
    const iterInput = document.getElementById('iterCount');

    // Check modules loaded
    const modules = [
      { name: 'OrderProcessor', ref: globalThis.OrderProcessor },
      { name: 'AddressNormalizer', ref: globalThis.AddressNormalizer },
      { name: 'AddressFuzzy', ref: globalThis.AddressFuzzy },
      { name: 'AddressParser', ref: globalThis.AddressParser },
      { name: 'AddressValidator', ref: globalThis.AddressValidator },
      { name: 'AddressRules', ref: globalThis.AddressRules },
      { name: 'AddressEngine', ref: globalThis.AddressEngine },
      { name: 'ADM_DB', ref: globalThis.ADM_DB },
    ];

    const missing = modules.filter(m => !m.ref).map(m => m.name);

    if (missing.length > 0) {
      overlay.innerHTML = `
        <p style="color:var(--red);font-size:16px;font-weight:600;">❌ Thiếu modules: ${missing.join(', ')}</p>
        <p style="margin-top:8px;color:var(--text-muted);">Mở file này từ thư mục gốc extension (cùng cấp manifest.json)</p>
      `;
      return;
    }

    // DB stats
    const provCount = ADM_DB.provinces.length;
    const wardMergerCount = typeof WARD_MERGER_MAP !== 'undefined' ? Object.keys(WARD_MERGER_MAP).length : 0;

    setTimeout(() => {
      overlay.classList.add('hidden');
    }, 300);

    statusBar.innerHTML = `✅ Đã nạp ${modules.length} modules. DB: ${provCount} tỉnh, ${wardMergerCount.toLocaleString()} ward mergers. Bấm <strong>Chạy Benchmark</strong> để bắt đầu.`;

    btnRun.disabled = false;
    btnRunQuick.disabled = false;

    btnRun.addEventListener('click', () => {
      const iters = Math.max(10, Math.min(5000, parseInt(iterInput.value) || 200));
      iterInput.value = iters;
      runBenchmark(iters);
    });

    btnRunQuick.addEventListener('click', () => {
      runBenchmark(50);
    });

    btnExport.addEventListener('click', () => {
      if (!lastResults) return;
      const blob = new Blob([JSON.stringify(lastResults, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `perf-benchmark-${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });
  }

  // Wait for all scripts to load
  if (document.readyState === 'complete') {
    init();
  } else {
    window.addEventListener('load', init);
  }
})();
</script>
</body>
</html>
