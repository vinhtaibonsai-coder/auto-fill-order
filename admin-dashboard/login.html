<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Fill System - Đăng Nhập</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body { 
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.07), 0 0 0 1px rgba(0, 0, 0, 0.02);
      max-width: 380px;
      width: 100%;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .login-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .logo-badge {
      width: 48px;
      height: 48px;
      background: #10b981;
      color: #ffffff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .login-title {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .login-subtitle {
      font-size: 12px;
      color: #64748b;
      line-height: 1.4;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .form-label {
      font-size: 12px;
      font-weight: 700;
      color: #334155;
    }

    .form-link {
      font-size: 11px;
      color: #10b981;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }
    .form-link:hover {
      text-decoration: underline;
    }

    .form-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background-color: #f8fafc;
      color: #0f172a;
      font-size: 13px;
      outline: none;
      transition: all 0.15s ease;
    }

    .form-input:focus {
      background-color: #ffffff;
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }

    .form-input.border-red-500 {
      border-color: #ef4444 !important;
      background-color: #fef2f2;
    }

    .error-msg {
      font-size: 11px;
      color: #ef4444;
      font-weight: 600;
      margin-top: 2px;
    }

    .hidden {
      display: none !important;
    }

    .btn-submit {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      background: #10b981;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
      transition: all 0.15s ease;
      margin-top: 6px;
    }

    .btn-submit:hover {
      background: #059669;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.35);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .login-footer {
      text-align: center;
      padding-top: 14px;
      border-top: 1px solid #f1f5f9;
      font-size: 11px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <div class="logo-badge">AF</div>
      <h2 class="login-title">Auto Fill System</h2>
      <p class="login-subtitle">Vui lòng đăng nhập tài khoản để tiếp tục làm việc</p>
    </div>
    
    <form id="login-form" style="display: flex; flex-direction: column; gap: 14px;" novalidate>
      <div class="form-group">
        <label class="form-label" for="login-email">Tên đăng nhập hoặc Email (*):</label>
        <input type="text" id="login-email" placeholder="yen_admin hoặc name@domain.com" class="form-input" required autocomplete="username">
        <p id="error-email" class="error-msg hidden"></p>
      </div>

      <div class="form-group">
        <div class="form-label-row">
          <label class="form-label" for="login-password">Mật khẩu (*):</label>
          <a class="form-link" id="link-forgot-password">Quên mật khẩu?</a>
        </div>
        <input type="password" id="login-password" placeholder="••••••••" class="form-input" required autocomplete="current-password">
        <p id="error-password" class="error-msg hidden"></p>
      </div>

      <button type="submit" id="login-submit-btn" class="btn-submit">
        <span>🔑 Bắt đầu đăng nhập</span>
      </button>
    </form>
    
    <div class="login-footer">
      <span>Dùng chung tài khoản với Extension Options</span>
    </div>
  </div>

  <script src="supabase-config.js"></script>
  <script src="auth.session.js"></script>
  <script src="auth.service.js"></script>
  <script src="login.js"></script>
</body>
</html>
